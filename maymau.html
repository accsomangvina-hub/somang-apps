<!DOCTYPE html>
<!-- maymau_v2 - bandwidth optimized -->
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>May Mẫu — Quản Lý Thông Số</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f9f8f5;
  --border:#e2e0d8;--border2:#ccc9bc;
  --text:#1a1917;--text2:#5a5750;--text3:#9a9690;
  --accent:#2563c8;--accent-l:#eff4ff;--accent-b:#bfd0f7;
  --green:#16a34a;--green-l:#f0fdf4;--green-b:#bbf7d0;
  --red:#dc2626;--red-l:#fef2f2;--red-b:#fecaca;
  --yellow:#d97706;--yellow-l:#fffbeb;--yellow-b:#fde68a;
  --r:8px;--rl:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:258px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.sb-head{padding:14px 14px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.sb-head-txt h1{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.sb-head-txt p{font-size:10px;color:var(--text3);margin-top:1px;}
#langBtn{padding:4px 9px;border-radius:20px;border:1px solid var(--border);background:var(--bg);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--accent);white-space:nowrap;}
#langBtn:hover{border-color:var(--accent);}
.sb-search{padding:8px 10px;border-bottom:1px solid var(--border);}
.sb-search input{width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;font-family:inherit;background:var(--bg);outline:none;color:var(--text);}
.sb-search input:focus{border-color:var(--accent);background:#fff;}
.sb-list{flex:1;overflow-y:auto;padding:6px;}
.mh-item{padding:9px 11px;border-radius:var(--r);cursor:pointer;margin-bottom:2px;border:1px solid transparent;transition:all .15s;}
.mh-item:hover{background:var(--bg);border-color:var(--border);}
.mh-item.active{background:var(--accent-l);border-color:var(--accent-b);}
.mh-code{font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--accent);}
.mh-name{font-size:11px;color:var(--text2);margin-top:1px;}
.mh-khach{font-size:10px;color:var(--text3);margin-top:1px;}
.mh-tags{display:flex;gap:3px;margin-top:4px;}
.tag{font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600;}
.tag-ao{background:var(--accent-l);color:var(--accent);}
.tag-quan{background:var(--green-l);color:var(--green);}
.tag-vay{background:var(--yellow-l);color:var(--yellow);}
.sb-foot{padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;}
.btn-add-mh{width:100%;padding:8px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;}
.btn-add-mh:hover{background:#1d4ed8;}
.sb-backup{display:flex;gap:6px;}
.sb-backup button{flex:1;padding:6px 4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text2);}
.sb-backup button:hover{background:var(--bg);}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar-l h2{font-size:16px;font-weight:700;}
.topbar-l p{font-size:11px;color:var(--text2);margin-top:1px;}
.topbar-r{display:flex;gap:6px;align-items:center;}
#syncStatus{font-size:11px;color:var(--text3);margin-right:4px;}
.btn{padding:6px 12px;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all .15s;display:inline-flex;align-items:center;gap:4px;}
.btn:hover{background:var(--bg);}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-primary:hover{background:#1d4ed8;}
.btn-danger{background:var(--red-l);color:var(--red);border-color:var(--red-b);}
.btn-green{background:var(--green-l);color:var(--green);border-color:var(--green-b);}
.btn-sm{padding:4px 9px;font-size:11px;}
.tabs{display:flex;padding:0 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;overflow-x:auto;}
.tab{padding:9px 14px;font-size:12px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--text2);transition:all .15s;white-space:nowrap;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.tab-badge{display:inline-flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text2);font-size:10px;font-weight:700;min-width:15px;height:15px;border-radius:8px;padding:0 3px;margin-left:4px;}
.tab.active .tab-badge{background:var(--accent-l);color:var(--accent);}
.content{flex:1;overflow:auto;padding:16px 20px;}
.sum-bar{display:flex;gap:10px;margin-bottom:14px;}
.sum-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;}
.sum-card .v{font-size:19px;font-weight:700;font-family:'JetBrains Mono',monospace;}
.sum-card .l{font-size:10px;color:var(--text3);margin-top:1px;}
.sum-card.ok{border-color:var(--green-b);}.sum-card.ok .v{color:var(--green);}
.sum-card.bad{border-color:var(--red-b);}.sum-card.bad .v{color:var(--red);}
.size-mgr{display:flex;align-items:center;gap:10px;margin-bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:9px 14px;flex-wrap:wrap;}
.size-mgr-lbl{font-size:11px;font-weight:600;color:var(--text2);}
.sz-chips{display:flex;gap:5px;flex-wrap:wrap;}
.sz-chip{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:20px;background:var(--accent-l);border:1px solid var(--accent-b);color:var(--accent);font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;}
.sz-del{background:none;border:none;cursor:pointer;color:var(--accent);font-size:12px;padding:0;opacity:.5;}
.sz-del:hover{opacity:1;color:var(--red);}
.btn-add-sz{padding:3px 10px;border-radius:20px;border:1px dashed var(--border2);font-size:11px;cursor:pointer;background:transparent;color:var(--text3);font-family:inherit;}
.btn-add-sz:hover{border-color:var(--accent);color:var(--accent);}
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:14px;}
.tbl-hd{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:space-between;}
.tbl-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;}
.tbl-icon{width:21px;height:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.ic-ao{background:var(--accent-l);color:var(--accent);}
.ic-quan{background:var(--green-l);color:var(--green);}
.ic-vay{background:var(--yellow-l);color:var(--yellow);}
.tbl-scroll{overflow-x:auto;}
table.mt{border-collapse:collapse;width:max-content;min-width:100%;}
.mt th{padding:0 8px;font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap;text-align:center;height:32px;}
.mt th.th-stt{width:34px;position:sticky;left:0;z-index:3;background:var(--surface2);}
.mt th.th-param{text-align:left;padding-left:12px;position:sticky;left:34px;z-index:3;min-width:200px;max-width:200px;background:var(--surface2);border-right:2px solid var(--border2);}
.mt th.th-sz-grp{font-size:12px;font-weight:700;color:var(--accent);font-family:'JetBrains Mono',monospace;letter-spacing:.06em;border-left:2px solid var(--border2);background:var(--accent-l);height:26px;}
.mt th.th-sub{font-size:9px;font-weight:500;color:var(--text2);text-transform:none;letter-spacing:0;height:28px;}
.mt th.th-sub small{display:block;font-size:8px;color:var(--text3);font-style:italic;margin-top:1px;}
.mt th.th-tru{font-size:9px;font-weight:600;color:var(--yellow);background:var(--yellow-l);text-transform:none;letter-spacing:0;height:28px;}
.mt th.th-tru small{display:block;font-size:8px;color:var(--yellow);font-style:italic;margin-top:1px;opacity:.8;}
.mt th.th-sub-first{border-left:2px solid var(--border2);}
.mt th.th-accept{width:50px;border-left:1px solid var(--border2);font-size:9px;}
.mt th.th-note{min-width:100px;text-align:left;padding-left:8px;}
.mt th.th-actions{width:38px;}
.mt td{padding:0;border-bottom:1px solid var(--border);vertical-align:middle;}
.mt tr:last-child td{border-bottom:none;}
.mt tr:hover td{background:#fafaf8;}
.mt tr:hover .td-stt,.mt tr:hover .td-param{background:#f5f4f0;}
.td-stt{width:34px;text-align:center;font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;padding:8px 4px;position:sticky;left:0;background:var(--surface);z-index:1;}
.td-param{padding:8px 12px;min-width:200px;max-width:200px;position:sticky;left:34px;background:var(--surface);z-index:1;border-right:2px solid var(--border2);}
.td-param .ko{font-size:12px;font-weight:600;}
.td-param .vi{font-size:10px;color:var(--text2);}
.td-qc{width:70px;border-left:2px solid var(--border2);padding:4px 5px;text-align:center;}
.td-tru{width:70px;padding:4px 5px;text-align:center;background:var(--yellow-l);}
.td-td{width:70px;padding:4px 5px;text-align:center;}
.td-ss{width:66px;padding:7px 5px;text-align:center;}
.td-kq{width:40px;padding:4px 5px;text-align:center;}
.td-accept{width:50px;border-left:1px solid var(--border2);padding:4px 5px;text-align:center;}
.td-note{padding:4px 8px;min-width:100px;}
.td-actions{width:38px;text-align:center;padding:4px;}
.ni{width:100%;padding:4px 5px;border:1px solid transparent;border-radius:5px;font-size:13px;font-family:'JetBrains Mono',monospace;text-align:center;background:transparent;color:var(--text);outline:none;transition:all .12s;}
.ni:hover{border-color:var(--border);background:var(--bg);}
.ni:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 2px rgba(37,99,200,.08);}
.ai{width:44px;padding:3px 4px;border:1px solid transparent;border-radius:5px;font-size:11px;font-family:'JetBrains Mono',monospace;text-align:center;background:transparent;color:var(--text3);outline:none;}
.ai:hover{border-color:var(--border);background:var(--bg);}
.ai:focus{border-color:var(--yellow);background:#fff;}
.note-i{width:100%;padding:4px 6px;border:1px solid transparent;border-radius:5px;font-size:11px;font-family:inherit;background:transparent;color:var(--text2);outline:none;}
.note-i:hover{border-color:var(--border);background:var(--bg);}
.note-i:focus{border-color:var(--accent);background:#fff;}
.dv{font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;}
.dv-ok{color:var(--green);}.dv-warn{color:var(--yellow);}.dv-bad{color:var(--red);}
.kq-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;}
.kq-ok{background:var(--green-l);color:var(--green);border:1px solid var(--green-b);}
.kq-warn{background:var(--yellow-l);color:var(--yellow);border:1px solid var(--yellow-b);}
.kq-bad{background:var(--red-l);color:var(--red);border:1px solid var(--red-b);}
.kq-empty{background:var(--bg);color:var(--text3);border:1px solid var(--border);}
.row-btn{background:none;border:none;cursor:pointer;font-size:12px;padding:3px 4px;border-radius:4px;color:var(--text3);transition:all .12s;}
.row-btn:hover{background:var(--red-l);color:var(--red);}
.view-toggle{display:flex;gap:0;margin-bottom:14px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;width:fit-content;}
.vt-btn{padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:var(--surface);color:var(--text2);font-family:inherit;transition:all .15s;}
.vt-btn:hover{background:var(--bg);}
.vt-btn.active{background:var(--accent);color:#fff;font-weight:600;}
.param-mgr{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:14px;}
.param-mgr-hd{padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.param-mgr-hd h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;}
.pm-col-hd{display:grid;grid-template-columns:24px 28px 1.2fr 1.5fr auto;gap:0;padding:6px 14px;background:var(--surface2);border-bottom:1px solid var(--border);}
.pm-col-hd span{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;}
.pm-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);transition:background .12s;}
.pm-row:last-child{border-bottom:none;}
.pm-row:hover{background:var(--surface2);}
.pm-drag{cursor:grab;color:var(--text3);font-size:14px;padding:0 4px;}
.pm-num{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--text3);width:22px;text-align:center;}
.pm-ko{font-size:12px;font-weight:600;flex:1.2;}
.pm-vi{font-size:11px;color:var(--text2);flex:1.5;}
.pm-actions{display:flex;gap:3px;}
.pm-btn{background:none;border:none;cursor:pointer;font-size:12px;padding:3px 5px;border-radius:4px;color:var(--text3);transition:all .12s;}
.pm-btn:hover.edit-btn{background:var(--accent-l);color:var(--accent);}
.pm-btn:hover.del-btn{background:var(--red-l);color:var(--red);}
.pm-btn:disabled{opacity:.25;cursor:default;}
.empty-s{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--text3);text-align:center;padding:40px;}
.empty-s h3{font-size:15px;font-weight:600;color:var(--text2);margin-bottom:6px;}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center;}
.mo.show{display:flex;}
.mo-box{background:var(--surface);border-radius:var(--rl);padding:22px;width:490px;max-width:95vw;max-height:85vh;overflow-y:auto;}
.mo-box h3{font-size:15px;font-weight:700;margin-bottom:14px;}
.fr{margin-bottom:12px;}
.fr>label{display:block;font-size:10px;font-weight:600;color:var(--text2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em;}
.fr input,.fr textarea,.fr select{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-family:inherit;color:var(--text);outline:none;background:var(--bg);}
.fr input:focus,.fr textarea:focus,.fr select:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 2px rgba(37,99,200,.08);}
.cb-group{display:flex;gap:14px;flex-wrap:wrap;}
.cb-group label{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;cursor:pointer;color:var(--text);}
.cb-group input[type=checkbox]{width:auto;}
.mo-foot{display:flex;justify-content:flex-end;gap:7px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
.cd-list{display:flex;flex-direction:column;gap:6px;}
.cd-item{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:6px 10px;}
.cd-item input{flex:1;border:none;background:transparent;font-size:13px;font-family:inherit;outline:none;color:var(--text);}
.btn-ic{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:2px 4px;border-radius:4px;}
.btn-ic:hover{background:var(--red-l);color:var(--red);}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
@page{margin:1cm;size:A4;}
@media print{
  .sidebar,.topbar-r,.tabs,.sb-foot,.size-mgr,.view-toggle,.td-actions,.mt th.th-actions{display:none!important;}
  .app{display:block;}.main{height:auto;overflow:visible;}.content{overflow:visible;padding:0;}
  body{background:#fff;}.tbl-wrap{break-inside:avoid;}
  .td-stt,.td-param,.mt th.th-stt,.mt th.th-param{position:static;}
  .sum-bar{display:none!important;}
  .td-ss,.td-kq,.th-ss,.th-kq{display:none!important;}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="sb-head">
    <div class="sb-head-txt"><h1 id="sb-h1">May Mẫu</h1><p id="sb-p">Quản lý thông số theo mã hàng</p></div>
    <button id="langBtn" onclick="toggleLang()">🌐 한국어</button>
  </div>
  <div class="sb-search"><input id="searchInp" placeholder="Tìm mã hàng..." oninput="filterList()"></div>
  <div class="sb-list" id="sbList"></div>
  <div class="sb-foot">
    <button class="btn-add-mh" id="btnAddMH" onclick="openAddMH()">＋ Thêm mã hàng</button>
    <button id="btnKho" onclick="openKho()" style="width:100%;padding:7px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:5px;">📚 Kho thông số</button>
    <div class="sb-backup">
      <button id="btnExportBk" onclick="exportBackup()">⬇ Xuất backup</button>
      <button id="btnImportBk" onclick="document.getElementById('importFile').click()">⬆ Nhập backup</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(event)">
    </div>
  </div>
</aside>
<main class="main">
  <div class="empty-s" id="emptyMain">
    <h3 id="emptyTitle">Chọn mã hàng để bắt đầu</h3>
    <p id="emptySub">Hoặc thêm mã hàng mới từ thanh bên</p>
  </div>
  <div id="mainWrap" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
    <div class="topbar">
      <div class="topbar-l"><h2 id="tbTitle">—</h2><p id="tbSub">—</p></div>
      <div class="topbar-r">
        <span id="syncStatus" onclick="manualSync()" title="Bấm để lấy dữ liệu mới nhất" style="cursor:pointer;text-decoration:underline dotted">✓</span>
        <button class="btn btn-sm" onclick="printPage()" id="btnPrint">⎙ In</button>
        <button class="btn btn-sm btn-green" onclick="exportExcel()" id="btnExcel">⬇ Excel</button>
        <button class="btn btn-sm" onclick="openEditMH()" id="btnEditMH">✎ Sửa mã</button>
        <button class="btn btn-sm btn-danger" onclick="deleteMH()" id="btnDelMH">✕ Xoá</button>
      </div>
    </div>
    <div class="tabs" id="tabBar"></div>
    <div class="content" id="contentArea"></div>
  </div>
</main>
</div>

<!-- Modal: Mã hàng -->
<div class="mo" id="modalMH">
  <div class="mo-box">
    <h3 id="moMHTitle">Thêm mã hàng</h3>
    <div class="fr"><label id="lbCode">Mã hàng *</label><input id="fCode" placeholder="VD: MP 8819" style="text-transform:uppercase"></div>
    <div class="fr"><label id="lbName">Tên sản phẩm</label><input id="fName" placeholder="VD: Áo sơ mi nữ"></div>
    <div class="fr"><label id="lbKhach">Khách hàng</label><input id="fKhach" placeholder="VD: Công ty ABC"></div>
    <div class="fr"><label id="lbLoai">Loại sản phẩm *</label>
      <div class="cb-group">
        <label><input type="checkbox" id="fAo"> <span id="cbAo">Áo (상의)</span></label>
        <label><input type="checkbox" id="fQuan"> <span id="cbQuan">Quần (하의)</span></label>
        <label><input type="checkbox" id="fVay"> <span id="cbVay">Váy (스커트)</span></label>
      </div>
    </div>

function renderTabs(){
  const m=db[cur];
  const cds=m.congDoan.map(cd=>{
    const c=cntOk(m,cd);
    return`<div class="tab ${curCD===cd&&currentView==='table'?'active':''}" data-cd="${cd.replace(/"/g,'&quot;')}" onclick="selCD(this.dataset.cd)">${cd}<span class="tab-badge">${c.ok}/${c.total}</span></div>`;
  }).join('');
  const paramTab=`<div class="tab ${currentView==='params'?'active':''}" onclick="switchView('params')" style="color:${currentView==='params'?'var(--accent)':'var(--green)'}">${_('tabParams')}</div>`;
  const editTab=`<div class="tab" style="color:var(--text3)" onclick="openEditMH()">✎</div>`;
  document.getElementById('tabBar').innerHTML=cds+paramTab+editTab;
}
function cntOk(m,cd){
  const ps=[...(m.paramsAo||[]),...(m.paramsQuan||[]),...(m.paramsVay||[])];
  let tot=0,ok=0;
  m.sizes.forEach(sz=>ps.forEach(p=>{
    const d=gc(m,sz,cd,p.id);
    if(d.spec!==''&&d.spec!==undefined){
      tot++;
      const diff=Math.abs((parseFloat(d.meas)||0)-(parseFloat(d.spec)||0));
      const acc=parseFloat(d.accept)||parseFloat(m.defaultAccept)||1;
      if(d.meas!==''&&d.meas!==undefined&&diff<=acc)ok++;
    }
  }));
  return{ok,total:tot};
}
function selCD(cd){curCD=cd;currentView='table';renderTabs();renderContent();}
function switchView(v){currentView=v;renderTabs();renderContent();}

function gc(m,sz,cd,pid){return(((m.data||{})[sz]||{})[cd]||{})[pid]||{};}
function sc(sz,cd,pid,field,val){
  const m=db[cur];
  if(!m.data)m.data={};
  if(!m.data[sz])m.data[sz]={};
  if(!m.data[sz][cd])m.data[sz][cd]={};
  if(!m.data[sz][cd][pid])m.data[sz][cd][pid]={};
  m.data[sz][cd][pid][field]=val;
  save(cur); refreshDiff(sz,cd,pid); renderTabs(); updateSum();
}

  }
  document.getElementById('contentArea').innerHTML=
    `<div class="sum-bar" id="sumBar"></div>`+
    renderSizeMgr(m)+
    (m.hasAo&&(m.paramsAo||[]).length?renderTbl(m,'ao',m.paramsAo):'')+
    (m.hasQuan&&(m.paramsQuan||[]).length?renderTbl(m,'quan',m.paramsQuan):'')+
    (m.hasVay&&(m.paramsVay||[]).length?renderTbl(m,'vay',m.paramsVay):'');
  updateSum();
}

function renderSizeMgr(m){
  return`<div class="size-mgr">
    <span class="size-mgr-lbl">${_('sizeLabel')}</span>
    <div class="sz-chips">
      ${m.sizes.map(sz=>`<span class="sz-chip">${sz}<button class="sz-del" onclick="delSize('${sz}')">×</button></span>`).join('')}
      <button class="btn-add-sz" onclick="addSize()">${_('addSize')}</button>
    </div>
  </div>`;
}

function renderTbl(m,type,params){
  const isAo=type==='ao', isVay=type==='vay';
  const sizes=m.sizes;
  const icon=isAo?'ic-ao':isVay?'ic-vay':'ic-quan';
  const iconTxt=isAo?'상':isVay?'스':'하';
  const secTitle=isAo?_('secAo'):isVay?_('secVay'):_('secQuan');
  const grp=sizes.map(sz=>`<th class="th-sz-grp" colspan="5">${sz}</th>`).join('')+
    `<th rowspan="2" class="th-accept">${_('colCP')}</th><th rowspan="2" class="th-note">${_('colNote')}</th><th rowspan="2" class="th-actions"></th>`;
  const sub=sizes.map(()=>
    `<th class="th-sub th-sub-first">${_('colQC')}<small>${_('colQCsub')}</small></th><th class="th-tru">${_('colTRU')}<small>${_('colTRUsub')}</small></th><th class="th-sub">${_('colTD')}<small>${_('colTDsub')}</small></th><th class="th-sub th-ss">${_('colSS')}<small>${_('colSSsub')}</small></th><th class="th-sub th-kq">${_('colKQ')}</th>`
  ).join('');
  const rows=params.map((p,i)=>{
    const szCells=sizes.map(sz=>{
      const d=gc(m,sz,curCD,p.id);
      const spec=d.spec!==undefined?d.spec:'';
      const tru=d.tru!==undefined?d.tru:'';
      const meas=d.meas!==undefined?d.meas:'';
      const acc=parseFloat(d.accept!==undefined?d.accept:m.defaultAccept)||1;
      const szk=sz.replace(/\s/g,'_');
      const{dh,kh}=calcDiff(spec,meas,acc);
      return`<td class="td-qc"><input class="ni" type="number" step="0.1" value="${spec}" placeholder="—" onchange="sc('${sz}','${curCD}','${p.id}','spec',this.value)" id="qc-${type}-${szk}-${p.id}"></td>
<td class="td-tru"><input class="ni" type="number" step="0.1" value="${tru}" placeholder="—" onchange="sc('${sz}','${curCD}','${p.id}','tru',this.value)" id="tru-${type}-${szk}-${p.id}"></td>
<td class="td-td"><input class="ni" type="number" step="0.1" value="${meas}" placeholder="—" onchange="sc('${sz}','${curCD}','${p.id}','meas',this.value)" id="td-${type}-${szk}-${p.id}"></td>
<td class="td-ss" id="ss-${type}-${szk}-${p.id}">${dh}</td>
<td class="td-kq" id="kq-${type}-${szk}-${p.id}">${kh}</td>`;
    }).join('');
    const d0=gc(m,sizes[0]||'',curCD,p.id);
    const acc0=d0.accept!==undefined?d0.accept:(m.defaultAccept||'1');
    return`<tr>
      <td class="td-stt">${i+1}</td>
      <td class="td-param"><div class="ko">${p.ko||''}</div><div class="vi">${p.vi}</div></td>
      ${szCells}
      <td class="td-accept"><input class="ai" type="number" step="0.5" value="${acc0}" title="±" onchange="setAcceptAll('${type}','${p.id}',this.value)"></td>
      <td class="td-note"><input class="note-i" type="text" value="${d0.note||''}" placeholder="${_('noteHint')}" onchange="sc('${sizes[0]||''}','${curCD}','${p.id}','note',this.value)"></td>
      <td class="td-actions"><button class="row-btn" title="Xoá" onclick="deleteParamById(this.dataset.t,this.dataset.id)" data-t="${type}" data-id="${p.id}">✕</button></td>
    </tr>`;
  }).join('');
  return`<div class="tbl-wrap">
    <div class="tbl-hd">
      <div class="tbl-title"><span class="tbl-icon ${icon}">${iconTxt}</span>${secTitle}</div>
      <span style="font-size:11px;color:var(--text3)">${params.length} ${lang==='ko'?'개 항목':'thông số'} · ${sizes.length} size</span>
    </div>
    <div class="tbl-scroll">
      <table class="mt">
        <thead><tr><th class="th-stt" rowspan="2">#</th><th class="th-param" rowspan="2">${_('colParam')}</th>${grp}</tr><tr>${sub}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

function calcDiff(spec,meas,acc){
  if(spec===''||spec===undefined||meas===''||meas===undefined)
    return{dh:'<span style="color:var(--text3);font-size:10px">—</span>',kh:'<span class="kq-badge kq-empty">·</span>'};
  const diff=parseFloat(meas)-parseFloat(spec);
  const abs=Math.abs(diff),sign=diff>0?'+':'';
  let cls,kc,kt;
  if(abs<=acc){cls='dv-ok';kc='kq-ok';kt='✓';}
  else if(abs<=acc*1.5){cls='dv-warn';kc='kq-warn';kt='!';}
  else{cls='dv-bad';kc='kq-bad';kt='✕';}
  return{dh:`<span class="dv ${cls}">${sign}${diff.toFixed(1)}</span>`,kh:`<span class="kq-badge ${kc}">${kt}</span>`};
}

function refreshDiff(sz,cd,pid){
  const m=db[cur];
  ['ao','quan','vay'].forEach(type=>{
    const ps=type==='ao'?(m.paramsAo||[]):type==='quan'?(m.paramsQuan||[]):(m.paramsVay||[]);
    if(!ps.find(x=>x.id===pid))return;
    const d=gc(m,sz,cd,pid);
    const acc=parseFloat(d.accept)||parseFloat(m.defaultAccept)||1;
    const szk=sz.replace(/\s/g,'_');
    const ss=document.getElementById(`ss-${type}-${szk}-${pid}`);
    const kq=document.getElementById(`kq-${type}-${szk}-${pid}`);
    if(!ss||!kq)return;
    const{dh,kh}=calcDiff(d.spec,d.meas,acc);
    ss.innerHTML=dh; kq.innerHTML=kh;
  });
}

function setAcceptAll(type,pid,val){
  const m=db[cur];
  m.sizes.forEach(sz=>{
    if(!m.data)m.data={};
    if(!m.data[sz])m.data[sz]={};
    if(!m.data[sz][curCD])m.data[sz][curCD]={};
    if(!m.data[sz][curCD][pid])m.data[sz][curCD][pid]={};
    m.data[sz][curCD][pid].accept=val;
    refreshDiff(sz,curCD,pid);
  });
  save(cur); updateSum();
}

function updateSum(){
  const m=db[cur]; const bar=document.getElementById('sumBar'); if(!bar)return;
  const ps=[...(m.paramsAo||[]),...(m.paramsQuan||[]),...(m.paramsVay||[])];
  let tot=0,meas=0,ok=0,bad=0;
  m.sizes.forEach(sz=>ps.forEach(p=>{
    const d=gc(m,sz,curCD,p.id);
    if(d.spec!==''&&d.spec!==undefined){tot++;
      if(d.meas!==''&&d.meas!==undefined){meas++;
        const diff=Math.abs(parseFloat(d.meas)-parseFloat(d.spec));
        const acc=parseFloat(d.accept)||parseFloat(m.defaultAccept)||1;
        if(diff<=acc)ok++;else bad++;}}
  }));
  bar.innerHTML=`
    <div class="sum-card"><div class="v">${tot}</div><div class="l">${_('sumTotal')}</div></div>
    <div class="sum-card"><div class="v">${meas}</div><div class="l">${_('sumMeas')}</div></div>
    <div class="sum-card ok"><div class="v">${ok}</div><div class="l">${_('sumOk')}</div></div>
    <div class="sum-card bad"><div class="v">${bad}</div><div class="l">${_('sumBad')}</div></div>
    <div class="sum-card"><div class="v">${meas>0?Math.round(ok/meas*100)+'%':'—'}</div><div class="l">${_('sumRate')}</div></div>`;
}

function addSize(){
  const sz=prompt(lang==='ko'?'사이즈 입력:':'Nhập size mới:'); if(!sz||!sz.trim())return;
  const m=db[cur];
  if(m.sizes.includes(sz.trim()))return alert(lang==='ko'?'이미 있는 사이즈입니다!':'Size đã tồn tại!');
  m.sizes.push(sz.trim()); save(cur); renderContent();
}
function delSize(sz){
  if(!confirm(lang==='ko'?`사이즈 ${sz}를 삭제하시겠습니까?`:`Xoá size ${sz}?`))return;
  const m=db[cur]; m.sizes=m.sizes.filter(s=>s!==sz);
  if(m.data&&m.data[sz])delete m.data[sz];
  save(cur); renderContent();
}

  if(!m.paramsVay)m.paramsVay=[];

    <button class="vt-btn" onclick="switchView('table')">${_('viewTable')}</button>

  </div>`;

    const ps=params||[];

    ps.forEach((p,i)=>{
      const last=i===(ps.length-1);
      rows+=`<div class="pm-row">
        <span class="pm-drag">⠿</span>
        <span class="pm-num">${i+1}</span>
        <span class="pm-ko">${p.ko||'—'}</span>

          <button class="pm-btn" onclick="moveParam(this.dataset.t,+this.dataset.i,1)" data-t="${q}" data-i="${i}" ${last?'disabled':''}>↓</button>
          <button class="pm-btn del-btn" onclick="deleteParam(this.dataset.t,+this.dataset.i)" data-t="${q}" data-i="${i}">✕</button>
        </div>
      </div>`;
    });
    const emptyMsg=lang==='ko'?'항목이 없습니다. 위 버튼으로 추가하세요.':'Chưa có thông số. Bấm nút trên để thêm.';
    return`<div class="param-mgr">
      <div class="param-mgr-hd">
        <h3><span class="tbl-icon ${iconCls}">${iconTxt}</span>${secLbl}</h3>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm" onclick="openPick(this.dataset.t)" data-t="${q}">${_('pickFrom')}</button>
          <button class="btn btn-sm btn-green" onclick="openAddParam(this.dataset.t)" data-t="${q}">${_('addNew')}</button>
        </div>
      </div>
      <div class="pm-col-hd"><span></span><span>#</span><span>${_('colKO')}</span><span>${_('colVI')}</span><span></span></div>
      ${rows||`<div style="padding:16px;text-align:center;font-size:12px;color:var(--text3)">${emptyMsg}</div>`}
    </div>`;
  };
  html+=(m.hasAo?sec(m.paramsAo,'ao',_('secAo'),'ic-ao','상'):'')+
        (m.hasQuan?sec(m.paramsQuan,'quan',_('secQuan'),'ic-quan','하'):'')+
        (m.hasVay?sec(m.paramsVay,'vay',_('secVay'),'ic-vay','스'):'');
  document.getElementById('contentArea').innerHTML=html;
}

function getArr(type){const m=db[cur];return type==='ao'?m.paramsAo:type==='quan'?m.paramsQuan:m.paramsVay;}
function moveParam(type,idx,dir){
  const a=getArr(type); const ni=idx+dir;
  if(ni<0||ni>=a.length)return;
  [a[idx],a[ni]]=[a[ni],a[idx]];
  save(cur); renderParamMgr();
}
function deleteParam(type,idx){
  const a=getArr(type);
  if(!confirm(`${lang==='ko'?'삭제하시겠습니까':'Xoá thông số'}:\n"${a[idx].vi}"?`))return;
  a.splice(idx,1); save(cur); renderParamMgr();
}
function deleteParamById(type,pid){
  const a=getArr(type); const idx=a.findIndex(p=>p.id===pid);
  if(idx===-1)return;
  if(!confirm(`${lang==='ko'?'삭제':'Xoá'}:\n"${a[idx].vi}"?`))return;
  a.splice(idx,1); save(cur); renderContent();
}

function saveParam(){
  currentView='params';
  const ko=document.getElementById('pKo').value.trim();
  const vi=document.getElementById('pVi').value.trim();
  const type=document.getElementById('pType').value;
  if(!vi)return alert(lang==='ko'?'베트남어 이름을 입력하세요!':'Vui lòng nhập tên tiếng Việt!');
  const m=db[cur];
  if(!m.paramsAo)m.paramsAo=[];
  if(!m.paramsQuan)m.paramsQuan=[];
  if(!m.paramsVay)m.paramsVay=[];
  const arr=type==='ao'?m.paramsAo:type==='quan'?m.paramsQuan:m.paramsVay;
  if(editP&&editPIdx!==null){
    const oldArr=editPType==='ao'?m.paramsAo:editPType==='quan'?m.paramsQuan:m.paramsVay;
    if(type!==editPType){
      const rem=oldArr.splice(editPIdx,1)[0];
      arr.push({...rem,ko,vi,type});

      oldArr[editPIdx]={...oldArr[editPIdx],ko,vi};
    }

    arr.push({id:genId(),type,ko,vi});

  save(cur); renderParamMgr(); closeModal('modalParam');
}

function confirmPick(){
  currentView='params';
  const m=db[cur];
  const khoItems=getKho(pickType);
  if(!m.paramsAo)m.paramsAo=[];
  if(!m.paramsQuan)m.paramsQuan=[];
  if(!m.paramsVay)m.paramsVay=[];
  const arr=pickType==='ao'?m.paramsAo:pickType==='quan'?m.paramsQuan:m.paramsVay;
  const existing=new Set(arr.map(p=>p.vi));
  document.querySelectorAll('[id^="pk-"]:checked:not(:disabled)').forEach(cb=>{

}

function saveMH(){
  const code=document.getElementById('fCode').value.trim().toUpperCase();
  if(!code)return alert('Vui lòng nhập mã hàng!');
  const hasAo=document.getElementById('fAo').checked;
  const hasQuan=document.getElementById('fQuan').checked;
  const hasVay=document.getElementById('fVay').checked;
  if(!hasAo&&!hasQuan&&!hasVay)return alert(lang==='ko'?'유형을 1개 이상 선택하세요!':'Chọn ít nhất 1 loại!');
  const sizes=document.getElementById('fSizes').value.split(',').map(s=>s.trim()).filter(Boolean);
  if(!sizes.length)return alert(lang==='ko'?'사이즈를 입력하세요!':'Nhập ít nhất 1 size!');
  const congDoan=[...document.querySelectorAll('[id^="cdi-"]')].map(e=>e.value.trim()).filter(Boolean);
  const name=document.getElementById('fName').value.trim();
  const khachHang=document.getElementById('fKhach').value.trim();
  const note=document.getElementById('fNote').value.trim();
  const defaultAccept=document.getElementById('fAccept').value||'1';
  if(!editMH){
    if(db[code])return alert(lang==='ko'?'이미 있는 코드입니다!':'Mã hàng đã tồn tại!');
    db[code]={code,name,khachHang,hasAo,hasQuan,hasVay,sizes,congDoan,defaultAccept,note,data:{},paramsAo:[],paramsQuan:[],paramsVay:[]};
  } else {
    const m=db[editingMH];
    if(hasAo&&!m.hasAo)m.paramsAo=[];
    if(hasQuan&&!m.hasQuan)m.paramsQuan=[];
    if(hasVay&&!m.hasVay)m.paramsVay=[];
    Object.assign(m,{name,khachHang,hasAo,hasQuan,hasVay,sizes,congDoan,defaultAccept,note});
  }
  save(); closeModal('modalMH'); renderSB(); selectMH(editMH?editingMH:code);

  if(!confirm(lang==='ko'?`코드 "${cur}"를 삭제하시겠습니까?`:`Xoá mã hàng "${cur}"?`))return;

function exportBackup(){
  const now=new Date();
  const ts=now.toISOString().slice(0,16).replace('T','_').replace(':','-');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));
  a.download=`backup_maymau_${ts}.json`; a.click();
}
function importBackup(event){
  const file=event.target.files[0]; if(!file)return;
  if(!confirm(lang==='ko'?`"${file.name}" 파일로 가져오시겠습니까?\n현재 데이터가 덮어씌워집니다!`:`Nhập backup từ "${file.name}"?\nDữ liệu hiện tại sẽ bị GHI ĐÈ!`)){event.target.value='';return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const imp=JSON.parse(e.target.result);
      if(typeof imp!=='object'||Array.isArray(imp))throw new Error('Invalid format');
      db=imp; save(); cur=null;
      document.getElementById('emptyMain').style.display='flex';
      document.getElementById('mainWrap').style.display='none';
      renderSB();
      alert(`✅ ${Object.keys(db).length} ${lang==='ko'?'개 코드 가져오기 완료!':'mã hàng đã nhập!'}`);
    }catch(err){alert('❌ '+err.message);}
    event.target.value='';
  };
  reader.readAsText(file);
}

function printPage(){
  // Clone content area, convert inputs to static text
  const area=document.getElementById('contentArea');
  const clone=area.cloneNode(true);

  // Replace input values with static spans
  clone.querySelectorAll('input').forEach(inp=>{
    const span=document.createElement('span');
    span.textContent=inp.value;
    span.style.cssText=inp.style.cssText;
    span.className=inp.className;
    inp.parentNode.replaceChild(span,inp);
  });

  // Remove buttons and action columns
  clone.querySelectorAll('button,.td-actions,.th-actions,[class*="btn"]').forEach(el=>el.remove());
  clone.querySelectorAll('[onclick]').forEach(el=>el.removeAttribute('onclick'));

  // Fix colspan: td-ss and td-kq are hidden (2 cols per size), so colspan 5 → 3
  clone.querySelectorAll('th.th-sz-grp').forEach(th=>{
    const cur=parseInt(th.getAttribute('colspan')||'5');
    // each size group: QC, TRU, TD, SS(hidden), KQ(hidden) = 5 cols, visible = 3
    const groups=Math.round(cur/5);
    th.setAttribute('colspan', groups*3);
    th.style.textAlign='center';
  });

  const onlyStyle=Array.from(document.querySelectorAll('style')).map(s=>s.outerHTML).join('');
  const googleFont='<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">';
  const tbTitle=document.getElementById('tbTitle').textContent;
  const tbSub=document.getElementById('tbSub').textContent;
  const time=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})
    +' '+new Date().toLocaleDateString('vi-VN',{day:'2-digit',month:'numeric',year:'numeric'});

  const w=window.open('','_blank','width=900,height=700');
  w.document.write('<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8">'
    +'<title>'+tbTitle+' — May Mẫu</title>'
    +googleFont+onlyStyle
    +'<style>'
    +'@page{margin:1cm;size:A4;}'
    +'body{background:#fff;font-family:\'Be Vietnam Pro\',sans-serif;}'
    +'.print-header{padding:8px 0 10px;border-bottom:2px solid #e2e0d8;margin-bottom:12px;}'
    +'.print-header h2{font-size:16px;font-weight:700;}'
    +'.print-header p{font-size:11px;color:#5a5750;margin-top:2px;}'
    +'.print-time{font-size:10px;color:#9a9690;float:right;margin-top:4px;}'
    +'.size-mgr,.view-toggle,.sum-bar,.td-actions,.mt th.th-actions{display:none!important;}'
    +'.td-stt,.td-param,.mt th.th-stt,.mt th.th-param{position:static!important;}'
    +'.td-ss,.td-kq,.th-ss,.th-kq{display:none!important;}'
    +'.tbl-wrap{break-inside:avoid;border:1px solid #e2e0d8;border-radius:8px;overflow:hidden;margin-bottom:14px;}'
    +'.mt th.th-sz-grp{text-align:center!important;vertical-align:middle!important;font-size:13px!important;font-weight:700!important;padding:6px 4px!important;}'
    +'.mt th{text-align:center!important;vertical-align:middle!important;}'
    +'.mt td{text-align:center!important;vertical-align:middle!important;padding:5px 4px!important;}'
    +'.td-param{text-align:left!important;padding-left:8px!important;}'
    +'.tbl-scroll{overflow:visible!important;}'
    +'.mt{width:100%!important;border-collapse:collapse!important;font-size:11px!important;}'
    +'</style></head><body>'
    +'<div class="print-header">'
    +'<span class="print-time">'+time+'</span>'
    +'<h2>'+tbTitle+'</h2>'
    +'<p>'+tbSub+'</p>'
    +'</div>'
    +clone.innerHTML
    +'</body></html>');
  w.document.close();
  setTimeout(()=>{w.focus();w.print();},800);
}

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
function initApp(){
  // Hiển thị loading overlay
  var ov=document.createElement('div');
  ov.id='loadOverlay';
  ov.style.cssText='position:fixed;inset:0;background:rgba(245,244,240,.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:inherit;';
  ov.innerHTML='<div style="font-size:28px;animation:spin 1s linear infinite">⟳</div><div style="font-size:14px;font-weight:600;color:#5a5750">Đang tải dữ liệu...</div><div id="loadSub" style="font-size:12px;color:#9a9690">Kết nối tới server</div>';
  document.body.appendChild(ov);
  function hideOverlay(){ var o=document.getElementById('loadOverlay'); if(o)o.remove(); }

  setSyncStatus('syncLoad','var(--text3)');
  fbDB.ref('mayMau').once('value').then(function(snap){
    var fd=snap.val();
    var local=JSON.parse(localStorage.getItem('mmDB6')||'{}');

    if(fd&&Object.keys(fd).length){
      // Merge: với mỗi key, lấy record nào có __ts mới hơn
      var merged=Object.assign({},fd);
      Object.keys(local).forEach(function(k){
        if(k==='__kho__') return;
        var fbTs=(fd[k]&&fd[k].__ts)||0;
        var lcTs=(local[k]&&local[k].__ts)||0;
        if(lcTs>fbTs){
          merged[k]=local[k];
          // Đẩy record mới hơn lên Firebase
          fbDB.ref('mayMau/'+k).set(local[k]).catch(function(e){console.warn(e);});
        }
      });
      if(local.__kho__){ merged.__kho__=local.__kho__; }
      db=merged;
      localStorage.setItem('mmDB6',JSON.stringify(db));
      var lsub=document.getElementById('loadSub');
      if(lsub)lsub.textContent='Đã tải '+Object.keys(db).filter(function(k){return k!=='__kho__';}).length+' mã hàng';
    } else if(Object.keys(local).length){
      db=local;
      fbDB.ref('mayMau').set(db).catch(function(e){console.warn(e);});
    }

    setSyncStatus('syncOk');
    migrate(); applyLang(); renderSB();
    hideOverlay();
  }).catch(function(){
    db=JSON.parse(localStorage.getItem('mmDB6')||'{}');
    var lsub=document.getElementById('loadSub');
    if(lsub)lsub.textContent='Offline — dùng dữ liệu cục bộ';
    setTimeout(hideOverlay, 1200);
    setSyncStatus('syncOff','var(--yellow)');
    migrate(); applyLang(); renderSB();
  });
  // [v2] Removed .on() - use manual sync button
}

/* ══════════════════════════════════════
   KHO THÔNG SỐ (Global Library)
══════════════════════════════════════ */
let khoTab = 'ao';
let editKhoIdx = null;

function getKho(type){ return db.__kho__ && db.__kho__[type] ? db.__kho__[type] : []; }

function saveKho(){
  if(!db.__kho__)db.__kho__={ao:[],quan:[],vay:[]};
  localStorage.setItem('mmDB6',JSON.stringify(db));
  fbDB.ref('mayMau/__kho__').set(db.__kho__).catch(function(e){console.warn(e);});
}

function initKho(){
  if(!db.__kho__){
    db.__kho__={
      ao: DEF_AO.map(p=>({id:genId(),ko:p.ko,vi:p.vi.replace(/^[A-Z]\. /,'')})),
      quan: DEF_QUAN.map(p=>({id:genId(),ko:p.ko,vi:p.vi.replace(/^[A-Z]\. /,'')})),
      vay: DEF_AO.map(p=>({id:genId(),ko:p.ko,vi:p.vi.replace(/^[A-Z]\. /,'')})),
    };
    save();
  }
}

function openKho(){
  initKho();
  khoTab='ao'; editKhoIdx=null;
  renderKhoContent();
  switchKhoTabUI('ao');
  document.getElementById('modalKho').classList.add('show');
}

function switchKhoTab(type){
  khoTab=type; editKhoIdx=null;
  switchKhoTabUI(type);
  renderKhoContent();
}

function switchKhoTabUI(type){
  ['ao','quan','vay'].forEach(t=>{
    const btn=document.getElementById('khoTab'+t.charAt(0).toUpperCase()+t.slice(1));
    if(btn) btn.className='vt-btn'+(t===type?' active':'');
  });
}

function renderKhoContent(){
  const items=getKho(khoTab);
  const secLabel=khoTab==='ao'?'상의 — Áo trên':khoTab==='quan'?'하의 — Quần':'스커트 — Váy';
  let html='';
  if(!items.length){
    html=`<div style="padding:20px;text-align:center;font-size:12px;color:var(--text3)">Kho trống. Bấm "＋ Thêm thông số mới" để thêm.</div>`;
  } else {
    html=`<table style="width:100%;border-collapse:collapse">
      <thead><tr style="background:var(--surface2)">
        <th style="padding:8px 10px;font-size:10px;font-weight:600;color:var(--text2);text-align:left;border-bottom:1px solid var(--border);width:32px">#</th>
        <th style="padding:8px 10px;font-size:10px;font-weight:600;color:var(--text2);text-align:left;border-bottom:1px solid var(--border)">Tiếng Hàn</th>
        <th style="padding:8px 10px;font-size:10px;font-weight:600;color:var(--text2);text-align:left;border-bottom:1px solid var(--border)">Tiếng Việt</th>
        <th style="padding:8px 10px;font-size:10px;font-weight:600;color:var(--text2);text-align:center;border-bottom:1px solid var(--border);width:80px">Thao tác</th>
      </tr></thead>
      <tbody>${items.map((p,i)=>`
        <tr style="border-bottom:1px solid var(--border)" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background=''">
          <td style="padding:8px 10px;font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace">${i+1}</td>
          <td style="padding:8px 10px;font-size:12px;font-weight:600">${p.ko||'—'}</td>
          <td style="padding:8px 10px;font-size:12px;color:var(--text2)">${p.vi}</td>
          <td style="padding:6px 10px;text-align:center">
            <button onclick="openEditKhoParam(${i})" style="background:none;border:none;cursor:pointer;font-size:13px;padding:2px 5px;border-radius:4px;color:var(--text3)" onmouseover="this.style.background='var(--accent-l)';this.style.color='var(--accent)'" onmouseout="this.style.background='';this.style.color='var(--text3)'">✎</button>
            <button onclick="deleteKhoParam(${i})" style="background:none;border:none;cursor:pointer;font-size:13px;padding:2px 5px;border-radius:4px;color:var(--text3)" onmouseover="this.style.background='var(--red-l)';this.style.color='var(--red)'" onmouseout="this.style.background='';this.style.color='var(--text3)'">✕</button>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  }
  document.getElementById('khoContent').innerHTML=html;
  document.getElementById('moKhoTitle').textContent=`📚 Kho thông số — ${secLabel} (${items.length} mục)`;
}

function openAddKhoParam(){
  editKhoIdx=null;
  document.getElementById('moKhoParamTitle').textContent='Thêm thông số vào kho';
  document.getElementById('kpType').value=khoTab;
  document.getElementById('kpKo').value='';
  document.getElementById('kpVi').value='';
  document.getElementById('modalKhoParam').classList.add('show');
}
function openEditKhoParam(idx){
  editKhoIdx=idx;
  const p=getKho(khoTab)[idx];
  document.getElementById('moKhoParamTitle').textContent='Sửa thông số';
  document.getElementById('kpType').value=khoTab;
  document.getElementById('kpKo').value=p.ko||'';
  document.getElementById('kpVi').value=p.vi||'';
  document.getElementById('modalKhoParam').classList.add('show');
}
function saveKhoParam(){
  const ko=document.getElementById('kpKo').value.trim();
  const vi=document.getElementById('kpVi').value.trim();
  const type=document.getElementById('kpType').value;
  if(!vi)return alert('Vui lòng nhập tên tiếng Việt!');
  if(!db.__kho__)db.__kho__={ao:[],quan:[],vay:[]};
  if(!db.__kho__[type])db.__kho__[type]=[];
  if(editKhoIdx!==null){
    db.__kho__[type][editKhoIdx]={...db.__kho__[type][editKhoIdx],ko,vi};
  } else {
    db.__kho__[type].push({id:genId(),ko,vi});
  }
  saveKho(); closeModal('modalKhoParam');
  khoTab=type; switchKhoTabUI(type); renderKhoContent();
}
function deleteKhoParam(idx){
  const p=getKho(khoTab)[idx];
  if(!confirm(`Xoá "${p.vi}" khỏi kho?`))return;
  db.__kho__[khoTab].splice(idx,1);
  saveKho(); renderKhoContent();
}

function exportExcel(){
  const m=db[cur];
  if(!m){return;}
  const wb=XLSX.utils.book_new();
  const mhCode=cur;
  const mhName=m.name||'';
  const khach=m.khachHang||'';
  const sizes=m.sizes||[];
  const cds=m.congDoan||[];

  // For each cong doan, create a sheet
  (cds.length?cds:['—']).forEach(cd=>{
    const sections=[
      {params:m.paramsAo||[],label:'Áo trên',has:m.hasAo},
      {params:m.paramsQuan||[],label:'Quần',has:m.hasQuan},
      {params:m.paramsVay||[],label:'Váy',has:m.hasVay},
    ].filter(s=>s.has&&s.params.length);

    const rows=[];

    // Title rows
    rows.push([`Mã hàng: ${mhCode}${mhName?' — '+mhName:''}`,,,`Khách hàng: ${khach}`]);
    rows.push([`Công đoạn: ${cd}`]);
    rows.push([]);

    sections.forEach(sec=>{
      // Section header
      const headerRow1=['#','THÔNG SỐ (KO)','THÔNG SỐ (VI)'];
      sizes.forEach(sz=>{
        headerRow1.push(sz,'','','','');
      });
      headerRow1.push('±CP','GHI CHÚ');
      rows.push(headerRow1);

      const headerRow2=['','',''];
      sizes.forEach(()=>{
        headerRow2.push('QUY CÁCH','ĐO TRƯỚC UI','THỰC ĐO','SAI SỐ','KQ');
      });
      headerRow2.push('','');
      rows.push(headerRow2);

      sec.params.forEach((p,i)=>{
        const row=[i+1, p.ko||'', p.vi||''];
        sizes.forEach(sz=>{
          const d=gc(m,sz,cd==='—'?null:cd,p.id);
          const spec=d.spec!==undefined?d.spec:'';
          const tru=d.tru!==undefined?d.tru:'';
          const meas=d.meas!==undefined?d.meas:'';
          const acc=parseFloat(d.accept!==undefined?d.accept:m.defaultAccept)||1;
          let saiSo='', kq='';
          if(spec!==''&&meas!==''){
            const diff=parseFloat(meas)-parseFloat(spec);
            saiSo=(diff>0?'+':'')+diff.toFixed(1);
            const abs=Math.abs(diff);
            kq=abs<=acc?'✓':abs<=acc*1.5?'!':'✕';
          }
          row.push(spec,tru,meas,saiSo,kq);
        });
        const d0=gc(m,sizes[0]||'',cd==='—'?null:cd,p.id);
        const acc0=d0.accept!==undefined?d0.accept:(m.defaultAccept||1);
        row.push(acc0, d0.note||'');
        rows.push(row);
      });
      rows.push([]); // blank row between sections
    });

    const ws=XLSX.utils.aoa_to_sheet(rows);

    // Column widths
    const colW=[{wch:4},{wch:28},{wch:28}];
    sizes.forEach(()=>{colW.push({wch:10},{wch:10},{wch:10},{wch:8},{wch:4});});
    colW.push({wch:6},{wch:20});
    ws['!cols']=colW;

    const sheetName=(cd==='—'?'Sheet1':cd).substring(0,31);
    XLSX.utils.book_append_sheet(wb,ws,sheetName);
  });

  const fileName=`${mhCode}${mhName?'_'+mhName:''}.xlsx`.replace(/[\/:*?"<>|]/g,'_');
  XLSX.writeFile(wb,fileName);
}

function manualSync(){
  setSyncStatus("syncLoad","var(--text3)");
  fbDB.ref("mayMau").once("value").then(function(snap){
    var fd=snap.val();
    if(fd){db=fd;localStorage.setItem("mmDB6",JSON.stringify(db));}
    setSyncStatus("syncOk");
    migrate();
    renderSB(document.getElementById("searchInp").value);
    if(cur&&db[cur]){renderTabs();renderContent();}
  }).catch(function(){setSyncStatus("syncOff","var(--yellow)");});
}

initApp();
</script>
